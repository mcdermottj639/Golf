<body>

<header class="hero">
  <button class="themebtn" data-action="toggle-theme" title="Toggle night mode">☾</button>
  <!-- The running build, top right of Home. It is filled in by render() from BUILD in
       app.js, so it is proof of what is ACTUALLY on the phone rather than what was
       published: if a deploy fails or an installed PWA is serving stale code, this is the
       number that disagrees. Tap it for the Data tab's update check. -->
  <button class="buildtag" id="buildTag" data-action="go" data-view="data" hidden
          title="The build running on this phone — tap to check for a new one"></button>
  <div class="badge">Caddie HQ · Jack McDermott</div>
  <h1 id="pageTitle">Caddie HQ</h1>
  <div class="tag" id="pageTag">Your bag, your stroke, your game — one book.</div>
</header>

<main id="view" class="wrap"></main>

<!-- Five bottom tabs (Sep 23 2026).
     TODAY · BAG · GAME · ROUNDS · COACH. The old centre TEE shortcut was removed at
     Jack's request; starting or resuming a round remains on Today and in Round Prep.
     Courses and Round Prep are segments inside Rounds, next to the cards they describe.
     Distinct inline SVGs need no icon font or network request. -->
<nav id="nav" aria-label="Main navigation">
  <button data-view="home" class="rnd"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg></span><span class="nl">TODAY</span></button>
  <button data-view="bag"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 9h10l-1 12H8L7 9ZM9 9V3H6M13 9V2h4M16 12h3v6h-3M11 12v6"/></svg></span><span class="nl">BAG</span></button>
  <button data-view="game"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 3v17h17M7 15l5-5 4 3 5-7M17 6h4v4"/></svg></span><span class="nl">GAME</span></button>
  <button data-view="rounds"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 21V3l12 4-12 4M4 21h9"/><circle cx="17" cy="19" r="2"/></svg></span><span class="nl">ROUNDS</span></button>
  <button data-view="coach" class="rnd"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="m9 12 2 2 4-4"/></svg></span><span class="nl">COACH</span></button>

<script src="./lessons.js"></script>
<script src="./courses-db.js"></script>
<script src="./course-cards.js"></script>
<script src="./round-takeaways.js"></script>
<script src="./bay-takeaways.js"></script>
<script src="./round-review.js"></script>
<script src="./app.js"></script>
<script>
// Keeping the installed app up to date.
// Registering once on load is NOT enough: an installed PWA can sit suspended for days
// and resume without ever re-fetching app.js, so a shipped fix silently never reaches
// the phone — which is exactly what happened on Aug 14. Two things fix it. We ask the
// browser to re-check sw.js on every load (and app.js's visibilitychange handler asks
// again each time the app comes back to the foreground), and because sw.js calls
// skipWaiting() + clients.claim(), a new build takes control the moment it installs and
// fires 'controllerchange' — at which point we reload once to pick up the new code.
if ('serviceWorker' in navigator && window.top === window) {
  // A first-ever visit also fires controllerchange (from clients.claim), and reloading
  // there would be a pointless flash — so only an app that was ALREADY controlled counts.
  var hadController = !!navigator.serviceWorker.controller, reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (reloading || !hadController) return;
    reloading = true;
    location.reload();
  });
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js')
      .then(function(reg){ reg.update(); })
      .catch(function(){});
  });
}
</script>
</body>
</html>
