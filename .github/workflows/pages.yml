name: Publish Caddie HQ to gh-pages

# Mirrors main to the gh-pages branch, which GitHub Pages serves.
# (The default Actions token can't enable a Pages site directly,
# so we use branch-based Pages instead of the deploy-pages action.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify data and existing-install updates
        run: |
          node --check app.js
          node --check round-review.js
          node -e "for (const f of ['coach-feed.json','front9-feed.json','path-feed.json','corrections-20260922.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
          node tests/findability.cjs
          node tests/sep22-migration.cjs
          node tests/range-sep22-5i-vg3.cjs
          node tests/metric-samples.cjs
          node tests/range-visuals.cjs
          node tests/source-rounds.cjs
          node tests/spyglass-bay-links.cjs
          node tests/round-comparison-mishits.cjs
          node tests/spyglass-shot-distance.cjs
          node tests/all-indoor-profiles.cjs
          node tests/round-identity.cjs
          node tests/round-review-import.cjs
      - name: Mirror main to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push -f origin HEAD:gh-pages
